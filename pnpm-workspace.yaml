packages:
  - .
minimumReleaseAgeExclude:
  - "@playwright/test@1.64.0"
  - "@shadcn/registry@0.1.3"
  - playwright-core@1.64.0
  - playwright@1.64.0
  - shadcn@4.21.4
allowBuilds:
  # Pulled by next-intl (I1); both ship prebuilt binaries as optional
  # dependencies, so their install scripts are not needed.
  "@parcel/watcher": false
  "@swc/core": false
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
