packages:
  - .
minimumReleaseAgeExclude:
  # Security exception approved by Marcelo on 24/10/2026: advisories for
  # next (critical RCE), zod, body-parser, undici, fast-uri and ip-address;
  # the patched versions are newer than the two-week rule (ADR 0017).
  - next@16.4.1
  - eslint-config-next@16.4.1
  - "@next/env@16.4.1"
  - "@next/eslint-plugin-next@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - zod@4.6.6
  - body-parser@2.4.0
  - undici@7.30.1
  - fast-uri@3.1.9
  - ip-address@10.7.4
  - "@playwright/test@1.64.0"
  - "@shadcn/registry@0.1.3"
  - playwright-core@1.64.0
  - playwright@1.64.0
  - shadcn@4.21.4
allowBuilds:
  # Pulled by next-intl (I1); both ship prebuilt binaries as optional
  # dependencies, so their install scripts are not needed.
  "@parcel/watcher": false
  "@swc/core": false
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
overrides:
  # Patched versions of transitive dependencies (security exception of
  # 24/10/2026, see minimumReleaseAgeExclude).
  zod: 4.6.6
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  undici@>=7.0.0 <7.30.1: 7.30.1
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  ip-address@<10.7.4: 10.7.4
