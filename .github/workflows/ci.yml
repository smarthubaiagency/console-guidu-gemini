name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.10.0
  SUPABASE_CLI_VERSION: 2.110.0

jobs:
  # Decides whether a pull request changes only documentation (every file in
  # docs/ or ending in .md). Then `db` and `e2e` are skipped, and a skipped
  # job counts as passed for the branch protection; `quality` always runs.
  # A push to main, an empty or unreadable diff, or a failure of this job
  # runs everything (fail closed).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect a documentation-only pull request
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            if files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")" && [[ -n "$files" ]]; then
              docs_only=true
              while IFS= read -r file; do
                case "$file" in
                  docs/*|*.md) ;;
                  *) docs_only=false; echo "Code change: $file"; break ;;
                esac
              done <<<"$files"
            else
              echo "Diff empty or unreadable: every job runs"
            fi
          else
            echo "Not a pull request: every job runs"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation only: $docs_only"

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_NAME: "GUIDU"
      APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Next.js build cache, keyed by the lockfile and the code; a code
      # change restores the last cache of the same lockfile. Hashed before
      # the install, so node_modules never enters the key.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'postcss.config.*', 'prisma/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Generate ephemeral encryption key
        shell: bash
        run: |
          enc_key="$(openssl rand -hex 32)"
          echo "::add-mask::$enc_key"
          echo "ENCRYPTION_KEY=$enc_key" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY_ID=k1" >> "$GITHUB_ENV"
          events_key="$(openssl rand -hex 32)"
          echo "::add-mask::$events_key"
          echo "EVENTS_HMAC_KEY=$events_key" >> "$GITHUB_ENV"
          echo "EVENTS_HMAC_KEY_ID=k1" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # F6a: fails on a high or critical advisory in what ships to production.
      # Dev-only tooling is reviewed in the audit report, not blocked here.
      - name: Dependency audit (production, high and critical)
        run: pnpm audit --prod --audit-level high
      - run: pnpm generate
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (database suites explicitly skipped without URLs — safe in quality job)
        run: pnpm test
      - run: pnpm build

  db:
    name: db
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Ephemeral Redis for the API rate limit (F4a); nothing persists.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_REQUIRED: "1"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Generate ephemeral encryption key
        shell: bash
        run: |
          enc_key="$(openssl rand -hex 32)"
          echo "::add-mask::$enc_key"
          echo "ENCRYPTION_KEY=$enc_key" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY_ID=k1" >> "$GITHUB_ENV"
          events_key="$(openssl rand -hex 32)"
          echo "::add-mask::$events_key"
          echo "EVENTS_HMAC_KEY=$events_key" >> "$GITHUB_ENV"
          echo "EVENTS_HMAC_KEY_ID=k1" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate

      - name: Prove database suite fails without required variables
        id: guard-negative
        run: |
          if pnpm test:spike; then
            echo "::error::Database test suite succeeded unexpectedly without DATABASE_URL, DIRECT_DATABASE_URL, SUPABASE_URL, or SUPABASE_ANON_KEY"
            exit 1
          fi
          echo "Database test suite correctly failed without required variables"

      - name: Install pinned Supabase CLI
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | sudo tar --extract --gzip --directory /usr/local/bin supabase supabase-go
          supabase --version

      - name: Seed ephemeral app_runtime before pooler bootstrap
        shell: bash
        run: |
          set -euo pipefail
          runtime_password="$(openssl rand -hex 24)"
          echo "::add-mask::$runtime_password"
          echo "RUNTIME_PASSWORD=$runtime_password" >> "$GITHUB_ENV"
          printf "do \$\$ begin if not exists (select 1 from pg_roles where rolname = 'app_runtime') then create role app_runtime login nosuperuser nocreatedb nocreaterole noinherit nobypassrls password '%s'; else alter role app_runtime password '%s'; end if; end \$\$;\n" "$runtime_password" "$runtime_password" > supabase/roles.sql

      - name: Start isolated local Supabase
        run: supabase start --exclude studio,inbucket,storage-api,imgproxy,realtime,postgres-meta,edge-runtime,logflare,vector

      - name: Rebuild database from every migration
        run: supabase db reset

      - name: Provision ephemeral app_runtime password and local URLs
        shell: bash
        run: |
          set -euo pipefail

          status_json="$(supabase status -o json)"
          api_url="$(jq -r '.API_URL' <<<"$status_json")"
          anon_key="$(jq -r '.ANON_KEY' <<<"$status_json")"
          admin_url="$(jq -r '.DB_URL' <<<"$status_json")"


          for attempt in {1..30}; do
            if PGPASSWORD="$RUNTIME_PASSWORD" psql \
              --host=127.0.0.1 --port=54329 --username=app_runtime.pooler-dev --dbname=postgres \
              --command="select 1" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Local transaction pooler did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          {
            echo "DATABASE_URL=postgresql://app_runtime.pooler-dev:${RUNTIME_PASSWORD}@127.0.0.1:54329/postgres?pgbouncer=true&connection_limit=10"
            echo "DIRECT_DATABASE_URL=postgresql://app_runtime:${RUNTIME_PASSWORD}@127.0.0.1:54322/postgres"
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_ANON_KEY=$anon_key"
            echo "ADMIN_URL=$admin_url"
          } >> "$GITHUB_ENV"

      - name: Provision ephemeral app_worker password (F3a)
        shell: bash
        run: |
          set -euo pipefail
          worker_password="$(openssl rand -hex 24)"
          echo "::add-mask::$worker_password"
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --quiet \
            --command="alter role app_worker with login password '${worker_password}'"
          echo "WORKER_DATABASE_URL=postgresql://app_worker:${worker_password}@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: Load synthetic test fixtures
        run: |
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/seed.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/membership-seed.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/admin-seed.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/auth/seed.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/audit-seed.sql

      - name: SQL policy tests
        run: |
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/auth/profiles-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/invariants.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/membership-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/audit.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/api-keys-adr0009.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/modules-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/partners-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/brand-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/partner-console-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/partner-customers-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/legal-support-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/billing-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/jobs-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/contract-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/billing-automation-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/operations-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/privacy-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/api-rate-limit-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/crm-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/proposals-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/platform-api-keys-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/portfolio-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/lodging-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/languages-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/legal-translations-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/notification-locale-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/machine-translation-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/ai-agents-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/ai-engine-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/channels-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/ai-notices-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/settings-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/email-templates-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/domains-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/public-domains-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/plans-limits-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/notifications-inbox-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/security-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/auth-settings-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/maintenance-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/ai-providers-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/api-integrations-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/payment-gateway-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/gb-maps-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/google-business-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/events-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/event-rules-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/platform-audit-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/matrix-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/workspace-soft-delete-rls.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/security-catalog.sql
          psql "$ADMIN_URL" --set=ON_ERROR_STOP=1 --file tests/core/attendant-rls.sql

      # IN3: a disposable Synapse (pip, no Docker image) on the Postgres of
      # the local Supabase, for tests/core/matrix.test.ts. Only its variables
      # file reaches the suite, so no other test sees Matrix turned on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Start a local Synapse for the Matrix core
        env:
          SYNAPSE_DIR: ${{ runner.temp }}/synapse
          SYNAPSE_PG_HOST: 127.0.0.1
          SYNAPSE_PG_PORT: "54322"
          SYNAPSE_PG_USER: postgres
          SYNAPSE_PG_PASSWORD: postgres
        run: |
          bash scripts/local/synapse.sh setup
          bash scripts/local/synapse.sh start
          bash scripts/local/synapse.sh env | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Prisma and Data API isolation suite
        run: npx vitest run --project integration --reporter=default --reporter=json --outputFile=/tmp/db-tests.json

      - name: Assert database test count > 0
        run: |
          count="$(jq '[.testResults[].assertionResults[] | select(.status != "skipped")] | length' /tmp/db-tests.json)"
          echo "Database tests executed (non-skipped): ${count}"
          if [ "${count}" -eq 0 ]; then
            echo "::error::0 database tests executed — expected >0"
            exit 1
          fi

      - name: Supabase logs on failure
        if: failure()
        run: supabase status && docker ps --all

      - name: Synapse log on failure
        if: failure()
        run: tail -n 200 "${{ runner.temp }}/synapse/data/homeserver.log" || true

  e2e:
    name: e2e
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_NAME: "GUIDU"
      APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Generate ephemeral encryption key
        shell: bash
        run: |
          enc_key="$(openssl rand -hex 32)"
          echo "::add-mask::$enc_key"
          echo "ENCRYPTION_KEY=$enc_key" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY_ID=k1" >> "$GITHUB_ENV"
          events_key="$(openssl rand -hex 32)"
          echo "::add-mask::$events_key"
          echo "EVENTS_HMAC_KEY=$events_key" >> "$GITHUB_ENV"
          echo "EVENTS_HMAC_KEY_ID=k1" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      # Chromium cached by the @playwright/test version of the lockfile; on
      # a hit only the system packages (not cacheable) are installed.
      - name: Read the Playwright version from the lockfile
        id: playwright
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE "s/^  '@playwright\/test@([0-9][^']*)':.*/\1/p" pnpm-lock.yaml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::@playwright/test not found in pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies (Chromium from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm test:e2e
      # The AI agents module is behind its flag (C04); its screens run here
      # with the flag on, in a server of their own.
      - name: Run AI agents E2E tests with the module flag
        run: pnpm test:e2e e2e/ai-agents.spec.ts e2e/platform-ai.spec.ts e2e/partner-ai.spec.ts
        env:
          GUIDU_MODULE_AI_AGENTS_ENABLED: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
